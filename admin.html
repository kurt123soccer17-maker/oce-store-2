<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCE Network | Admin</title><link rel="stylesheet" href="style.css?v=20260809"></head><body class="admin-body"><header class="nav"><a class="brand" href="index.html"><img src="oce-logo.png" alt="OCE Network"><span>NETWORK</span></a><a class="discord" href="index.html">Back to Store</a></header><main class="admin"><section id="login"><div class="panel narrow"><div class="eyebrow">OCE NETWORK</div><h1>ADMIN PANEL</h1><p class="muted">Production server-side authentication. Your password never appears in this page's source.</p><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Admin password"><button class="btn primary full" onclick="adminLogin()">LOGIN</button><div id="loginMsg" class="error"></div></div></section><section id="dashboard" class="hidden"><div class="admin-head"><div><div class="eyebrow">CONTROL CENTER</div><h1>STORE ADMIN</h1></div><button class="btn ghost" onclick="logout()">LOG OUT</button></div><div class="panel"><h2>Products</h2><p class="muted">Prices are stored server-side. Rank prices are A$6, A$12 and A$18 by default.</p><div id="productEditor"></div></div><div class="panel"><h2>Site settings</h2><label>Server IP<input id="siteIP"></label><label>Discord invite URL<input id="siteDiscord" placeholder="https://discord.gg/..."></label><button class="btn primary" onclick="saveSite()">SAVE SETTINGS</button> <span id="saveMsg" class="success"></span></div><div class="panel"><h2>Orders</h2><div class="admin-order-tools"><input id="orderSearch" placeholder="Order ID or Minecraft username"><select id="orderStatus"><option value="">All payments</option><option value="paid">Paid</option><option value="pending">Pending</option><option value="failed">Failed</option></select><button class="btn primary" onclick="loadOrders()">SEARCH</button></div><div id="orders"></div></div></section></main><script src="admin.js?v=20260810"></script></body></html>
