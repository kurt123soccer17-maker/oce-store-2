<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCE Network | Order</title><link rel="stylesheet" href="style.css?v=20260809"></head><body><main class="admin"><div class="panel narrow"><div class="eyebrow">OCE NETWORK</div><h1>ORDER STATUS</h1><p id="status" class="muted">Checking your order…</p><a class="btn primary full" href="/">BACK TO STORE</a></div></main><script>(async()=>{const id=new URLSearchParams(location.search).get("order");if(!id){document.getElementById("status").textContent="No order ID was provided.";return}try{const r=await fetch("/api/orders/"+encodeURIComponent(id));const o=await r.json();if(!r.ok)throw new Error(o.error);document.getElementById("status").innerHTML="Order <b>"+o.id+"</b><br>Player: "+o.minecraft_username+"<br>Payment: "+o.payment_status+"<br>Delivery: "+o.delivery_status+"<br><br>Payment confirmation is handled server-side. If delivery is still pending, it may take a moment."}catch(e){document.getElementById("status").textContent=e.message}})();</script></body></html>
